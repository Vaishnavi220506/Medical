services:
  oncovision:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data        # studies database and images
      - ./weights:/app/weights  # trained model checkpoints
      - ./samples:/app/samples:ro  # one-click sample scans
